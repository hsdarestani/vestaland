name: Bootstrap Vestaland source

on:
  push:
    branches:
      - agent/build-vestaland-source
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v1.1/source.part.* > /tmp/vestaland-source.b64
          base64 --decode /tmp/vestaland-source.b64 > /tmp/vestaland-source.tar.gz
          echo "11832236587ee5c412f38d4c87a316abcee2cf804df1b759a6bf9b560ec36adf  /tmp/vestaland-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/vestaland-source.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign Vestaland 1.1 fantasy Persian UI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
