name: Bootstrap Vestaland source

on:
  push:
    branches:
      - agent/build-vestaland-mvp

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part.* > /tmp/vestaland-source.b64
          base64 --decode /tmp/vestaland-source.b64 > /tmp/vestaland-source.tar.gz
          echo "923c2fb83ecd8b6d01092f72d6f35d48968baff2b4b486b77ad791fa082c0913  /tmp/vestaland-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/vestaland-source.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Vestaland Android app and WooCommerce bridge"
          git push origin "HEAD:${GITHUB_REF_NAME}"
