name: Bootstrap Vestaland source

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
  push:
    branches: [agent/build-vestaland-source]

permissions:
  contents: write
  pull-requests: read

jobs:
  unpack:
    if: >-
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/bootstrap-vestaland') || github.event_name != 'issue_comment')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/build-vestaland-source
          fetch-depth: 0

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/source.part.00
          cat .bootstrap/source.part.* > /tmp/vestaland-source.b64
          base64 --decode /tmp/vestaland-source.b64 > /tmp/vestaland-source.tar.gz
          echo "923c2fb83ecd8b6d01092f72d6f35d48968baff2b4b486b77ad791fa082c0913  /tmp/vestaland-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/vestaland-source.tar.gz -C .
          rm -rf .bootstrap

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Vestaland Android app and WooCommerce bridge"
          git push origin HEAD:agent/build-vestaland-source
